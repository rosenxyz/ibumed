<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yönetim Kurulu — İBUMED</title>
<meta name="description" content="İBUMED yönetim kurulu — dünden bugüne derneğimizin yöneticileri.">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/style.css">
<script src="js/board-data.js"></script>
</head>
<body data-page="board">

<div id="site-header"></div>

<main>
  <div class="page-hero">
    <div class="wrap">
      <div class="eyebrow" data-i18n="board.kicker">KURUMSAL</div>
      <h1 data-i18n="board.h1">Yönetim Kurulu</h1>
      <p data-i18n="board.desc">Dünden bugüne derneğimizin yöneticileri — kurucu kadrodan bugüne, İBUMED'i büyüten isimler.</p>
    </div>
  </div>

  <section>
    <div class="wrap">
      <div class="board-current reveal">
        <div class="eyebrow" data-i18n="board.current.kicker">GÜNCEL — 15.08.2025'TEN İTİBAREN</div>
        <h2 data-i18n="board.current.h2">İBUMED Yeni Yönetim Kurulu</h2>
        <div class="member-grid" id="currentBoardGrid"></div>
      </div>

      <div class="eyebrow" data-i18n="board.archive.kicker">ARŞİV</div>
      <div class="section-head">
        <h2 data-i18n="board.archive.h2">Önceki Yönetim Kurulları</h2>
      </div>

      <div class="timeline" id="timelineRoot"></div>
    </div>
  </section>
</main>

<div id="site-footer"></div>
<div id="cookie-consent-root"></div>

<script src="js/data.js"></script>
<script src="js/i18n.js"></script>
<script src="js/components.js"></script>
<script src="js/app.js"></script>
<script src="js/consent.js"></script>
<script>
  renderHeader("board");
  renderFooter();
  renderCookieConsent();

  const ROLE_KEY = {
    "Başkan": "role.president", "Başkan Yardımcısı": "role.vp", "Sayman": "role.treasurer",
    "Genel Sekreter": "role.secretary", "YK Üyesi": "role.member", "Üye": "role.member",
  };
  function roleLabel(tr) { return t(ROLE_KEY[tr] || "role.member") || tr; }
  function nameRole(entry) {
    // "Nihal Öğten (Başkan)" -> { name, role }
    const m = entry.match(/^(.*)\s\(([^)]+)\)$/);
    return m ? { name: m[1], roleTr: m[2] } : { name: entry, roleTr: "Üye" };
  }

  const currentBoard = IBUMED_BOARD; // ortak veri kaynağı — bkz. js/board-data.js

  function initials(name) {
    return name.split(" ").filter(Boolean).map(w => w[0]).join("").slice(0, 2).toLocaleUpperCase("tr-TR");
  }

  const boards = [
    { range: "29.07.2022 – 15.08.2025", members: ["Nihal Öğten (Başkan)","Cevher Altuğ (Başkan Yardımcısı)","Cem Kösemeci (Genel Sekreter)","Cengizhan Yıldırım (Sayman)","İlkay Bağatır (Üye)","Nuriye Özengin (Üye)","Kerim Sözbir (Üye)"] },
    { range: "23.08.2019 – 29.07.2022", members: ["Senem Dursun Onaran (Başkan)","Mert Birincioğlu (Genel Sekreter)","Nihal Öğten (Sayman)","Cevher Altuğ (Üye)","Birgül Yılmaz (Üye)","Barış Demir (Üye)","İlkay Karakılıç (Üye)"] },
    { range: "29.07.2016 – 23.08.2019", members: ["Nihal Öğten (Başkan)","Mert Birincioğlu (Başkan Yardımcısı)","Cevher Altuğ (Genel Sekreter)","İsa Gürel (Sayman)","Fatih Soyaydın (Üye)","Zuhal Kılınç (Üye)","Elçim Badur (Üye)"] },
    { range: "28.07.2013 – 29.07.2016", members: ["Nihal Öğten (Başkan)","Mert Birincioğlu (Başkan Yardımcısı)","Ramazan Günoğlu (Genel Sekreter)","Senem Dursun (Sayman)","Zühal Kılınç (Üye)","Fatih Soyaydın (Üye)","Elçim Badur (Üye)"] },
    { range: "19.12.2010 – 27.07.2013", members: ["Mert Birincioğlu (Başkan)","Senem Dursun (Başkan Yardımcısı)","Nihal Öğten (Genel Sekreter)","Levent Dicle (Sayman)","Zühal Kılınç (Üye)","İsa Gürel (Üye)","Volkan Atabek (Üye)"] },
    { range: "founding", members: ["Metin İstay (Başkan)","Mert Birincioğlu (Başkan Yardımcısı)","Cemile Abdulganioğlu (Başkan Yardımcısı)","Nihal Öğten (Genel Sekreter)","Senem Dursun (Sayman)","Ali Şükrü Keleş (Üye)","Nazmi Bal (Üye)"] },
  ];

  function draw() {
    document.getElementById("currentBoardGrid").innerHTML = currentBoard.map(({ name, roleTr, photo, links }) => {
      const linksHtml = (links && links.length)
        ? `<div class="member-links">${links.map(l => `<a href="${l.url}" target="_blank" rel="noopener" class="member-link-chip">${l.label} ↗</a>`).join("")}</div>`
        : "";
      const avatarHtml = photo
        ? `<img class="member-avatar member-avatar-photo" src="${photo}" alt="${escapeHTML(name)}" loading="lazy">`
        : `<div class="member-avatar">${initials(name)}</div>`;
      return `<div class="member-card">
        ${avatarHtml}
        <div class="member-role">${roleLabel(roleTr)}</div>
        <div class="member-name">${escapeHTML(name)}</div>
        ${linksHtml}
      </div>`;
    }).join("");

    document.getElementById("timelineRoot").innerHTML = boards.map(b => {
      const rangeLabel = b.range === "founding" ? t("board.founding") : b.range;
      const membersLabel = b.members.map(entry => {
        const { name, roleTr } = nameRole(entry);
        return `${name} (${roleLabel(roleTr)})`;
      }).join(" · ");
      return `
      <div class="timeline-item reveal">
        <div class="timeline-date">${rangeLabel}</div>
        <h4 data-i18n="board.timeline.title">Yönetim Kurulu</h4>
        <div class="timeline-members">${membersLabel}</div>
      </div>`;
    }).join("");
    applyI18n();
    initReveal();
  }

  draw();
  document.addEventListener("ibumed:langchange", draw);
</script>
</body>
</html>
