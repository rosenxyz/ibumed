<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">Yazı — İBUMED</title>
<meta name="description" id="pageDesc" content="İBUMED blog yazısı">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="blog">

<div id="site-header"></div>

<main id="postRoot">
  <!-- JS ile doldurulacak -->
</main>

<div id="site-footer"></div>
<div id="cookie-consent-root"></div>

<script src="js/data.js"></script>
<script src="js/i18n.js"></script>
<script src="js/components.js"></script>
<script src="js/app.js"></script>
<script src="js/consent.js"></script>
<script>
  renderHeader("blog");
  renderFooter();
  renderCookieConsent();

  const params = new URLSearchParams(window.location.search);
  const slug = params.get("slug");
  const allPosts = getAllPosts();
  const post = allPosts.find(p => p.slug === slug);
  const root = document.getElementById("postRoot");

  function drawPost() {
    if (!post) {
      root.innerHTML = `
        <div class="wrap" style="padding:100px 0; text-align:center;">
          <h1 style="font-size:32px;" data-i18n="post.notfound.h1">Yazı bulunamadı</h1>
          <p style="margin-top:14px; color:var(--ink-500);" data-i18n="post.notfound.p">Aradığınız yazı kaldırılmış ya da bağlantı hatalı olabilir.</p>
          <a href="blog.html" class="btn btn-primary" style="margin-top:26px;" data-i18n="post.notfound.cta">Bloga Dön</a>
        </div>`;
      applyI18n();
      return;
    }

    const title = getLocalizedField(post, "title");
    const excerpt = getLocalizedField(post, "excerpt");
    const bodyHtml = getLocalizedField(post, "body_html") || mdToHtml(getLocalizedField(post, "body_md")) || `<p>${escapeHTML(excerpt)}</p>`;
    const showTrNotice = getLang() === "en" && !hasEnglishTranslation(post);

    document.getElementById("pageTitle").textContent = title + " — İBUMED";
    document.getElementById("pageDesc").setAttribute("content", excerpt || title);

    const related = allPosts
      .filter(p => p.slug !== post.slug && p.category === post.category)
      .slice(0, 3);
    const relatedFallback = related.length ? related : allPosts.filter(p => p.slug !== post.slug).slice(0, 3);

    root.innerHTML = `
      <div class="post-hero">
        <div class="wrap">
          <div class="breadcrumb">
            <a href="index.html" data-i18n="breadcrumb.home">Anasayfa</a> <span>/</span> <a href="blog.html" data-i18n="breadcrumb.blog">Blog</a> <span>/</span> <span>${categoryLabel(post.category)}</span>
          </div>
          <div class="post-hero-meta">
            <span class="post-chip" style="position:static; background:var(--pine-500);">${categoryLabel(post.category)}</span>
            <span class="post-date">${turkishDate(post.date)} · ${post.readingTime || 2} ${t("post.reading")}${post.author ? ` · ${t("post.by")} ${escapeHTML(post.author)}` : ""}</span>
          </div>
          <h1>${escapeHTML(title)}</h1>
        </div>
      </div>

      <div class="wrap">
        ${showTrNotice ? `<div class="notice notice-warn" style="margin-top:24px;">${t("post.trnotice")}</div>` : ""}
        <div class="post-hero-image" onclick="openLightbox('${post.image || 'assets/images/hero_anasayfa.jpeg'}', '${escapeHTML(title).replace(/'/g, "\\'")}')" title="${t('post.viewfull') || 'Orijinalini görüntüle'}">
          <img src="${post.image || 'assets/images/hero_anasayfa.jpeg'}" alt="${escapeHTML(title)}">
          ${post.imageCredit ? `<span class="hero-image-credit">${escapeHTML(post.imageCredit)}</span>` : ""}
        </div>

        <div class="article-layout">
          <article class="article-body">${bodyHtml}</article>
          <aside class="post-side">
            <div class="side-card">
              <h4 data-i18n="post.tags">Etiketler</h4>
              ${(post.tags && post.tags.length) ? post.tags.map(tag => `<span class="tag-pill">${escapeHTML(tag)}</span>`).join("") : `<span class="tag-pill">İBUMED</span>`}
            </div>
            <div class="side-card">
              <h4 data-i18n="post.share">Paylaş</h4>
              <div class="share-row">
                <a href="https://twitter.com/intent/tweet?text=${encodeURIComponent(title)}&url=${encodeURIComponent(window.location.href)}" target="_blank" rel="noopener" aria-label="Twitter'da paylaş"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M22 5.9c-.7.3-1.5.6-2.3.7.8-.5 1.5-1.3 1.8-2.3-.8.5-1.6.8-2.6 1-.7-.8-1.8-1.3-3-1.3-2.3 0-4.1 1.9-4.1 4.1 0 .3 0 .6.1.9-3.4-.2-6.4-1.8-8.4-4.3-.4.6-.6 1.3-.6 2.1 0 1.4.7 2.7 1.8 3.4-.7 0-1.3-.2-1.9-.5v.1c0 2 1.4 3.6 3.3 4-.3.1-.7.1-1.1.1-.3 0-.5 0-.8-.1.5 1.6 2.1 2.8 3.9 2.8-1.4 1.1-3.2 1.8-5.2 1.8-.3 0-.7 0-1-.1 1.9 1.2 4.1 1.9 6.5 1.9 7.8 0 12-6.4 12-12v-.5c.8-.6 1.5-1.3 2.1-2.1z"/></svg></a>
                <a href="https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(window.location.href)}" target="_blank" rel="noopener" aria-label="Facebook'ta paylaş"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M13.5 21v-7.5H16l.4-3H13.5V8.4c0-.9.2-1.5 1.5-1.5H16.5V4.2C16.2 4.1 15.2 4 14 4c-2.4 0-4 1.5-4 4.1v2.4H7.5v3H10V21h3.5z"/></svg></a>
                <a href="#" id="copyLinkBtn" aria-label="Bağlantıyı kopyala">${ICONS.link}</a>
              </div>
            </div>
            <a href="blog.html" class="btn btn-ghost btn-block" data-i18n="post.back">← Tüm Yazılar</a>
          </aside>
        </div>
      </div>

      <section class="band-alt related-strip">
        <div class="wrap">
          <div class="eyebrow" data-i18n="post.related.kicker">DEVAMINI OKU</div>
          <h2 style="margin-top:14px; font-size:26px;" data-i18n="post.related.h2">İlgili Yazılar</h2>
          <div class="post-grid" style="margin-top:32px;">
            ${relatedFallback.map(postCardHTML).join("")}
          </div>
        </div>
      </section>
    `;

    const copyBtn = document.getElementById("copyLinkBtn");
    if (copyBtn) {
      copyBtn.addEventListener("click", (e) => {
        e.preventDefault();
        navigator.clipboard?.writeText(window.location.href).then(() => {
          copyBtn.innerHTML = ICONS.check;
          setTimeout(() => copyBtn.innerHTML = ICONS.link, 1600);
        });
      });
    }
    applyI18n();
    initReveal();
    // İçerik içindeki görselleri tıklanınca orijinal boyutunda açılacak şekilde işaretle —
    // aynı yazıdaki tüm görseller tek bir grup olarak verilir, böylece lightbox
    // açıldığında ok tuşlarıyla/‹ › düğmeleriyle diğer görsellere geçilebilir.
    const contentImgs = Array.from(document.querySelectorAll(".article-body img"));
    const lightboxGroupItems = contentImgs.map(img => ({ src: img.src, caption: img.alt || title }));
    contentImgs.forEach(img => {
      img.classList.add("zoomable-img");
      img.addEventListener("click", () => openLightbox(img.src, img.alt || title, lightboxGroupItems));
    });
  }

  drawPost();
  document.addEventListener("ibumed:langchange", drawPost);
</script>
</body>
</html>
